# サブスク・VOD アフィリエイト投稿テンプレート
templates:
  - topic: "U-NEXT"
    template: |
      #PR
      {{ experience }}

      {{ benefits }}

      {{ honest }}

      気になる人はプロフのリンクから🎬
    variables:
      experience:
        - "U-NEXTを1年使った正直レビュー。\n結論：VODの中で一番おすすめできる🎯"
        - "「U-NEXTは高い」って思ってたけど、\n使ってみたら意外とコスパ良かった話"
        - "家族4人でU-NEXTを使い始めて半年。\nぶっちゃけ最高すぎる🎬"
      benefits:
        - "良いところ：\n✅ 見放題31万本以上（業界No.1）\n✅ 毎月1200ptもらえる（実質月額1000円以下）\n✅ 最新映画の配信が早い\n✅ 漫画・雑誌も読める📚"
        - "コスパ計算してみた：\n月額2189円 - 1200pt = 実質989円\n\n989円で31万本見放題＋漫画も読める。\n映画1本の値段で1ヶ月楽しめるぜ🎉"
        - "家族に嬉しいポイント：\n✅ 4アカウントまで同時視聴OK\n✅ キッズ向けコンテンツ充実\n✅ ペアレンタルコントロールあり\n✅ 各自の視聴履歴が独立\n\n家族で割ったら1人500円以下だぜ💪"
      honest:
        - "デメリットも言うと：\n・月額は他より高め（でもポイントで相殺）\n・アプリが若干重い時がある\n\n31日間の無料トライアルがあるから試してみて"
        - "注意点：\n無料トライアル中に解約すれば0円。\n解約も簡単にできるから安心してくれ"
        - "正直、作品数は圧倒的。\nただしUIは改善の余地あり。\n\n無料トライアルで実際に使ってみるのが一番"

  - topic: "DMM TV"
    template: |
      #PR
      {{ hook }}

      {{ review }}

      {{ recommendation }}

      詳しくはプロフのリンクから📺
    variables:
      hook:
        - "月550円のVODがここまで強いとは思わなかった😳\nDMM TVのガチレビュー"
        - "アニメ好きなら絶対チェックしてほしいVODがある"
        - "「安いVODってしょぼいんでしょ？」って思ってたけど..."
      review:
        - "DMM TVの良いところ：\n✅ 月額550円（ワンコイン！）\n✅ アニメカバー率が異常に高い\n✅ 独占・先行配信あり\n✅ バラエティも充実\n\nぶっちゃけ、アニメだけならNetflixより上🎯"
        - "月550円で：\n🎬 新作アニメほぼ全部カバー\n🎬 過去の名作アニメ大量\n🎬 2.5次元舞台も見れる\n🎬 バラエティも意外と面白い\n\nこのコスパは他にない💪"
        - "ぶっちゃけ最初は期待してなかった。\nでも使ってみたら、\nアニメのラインナップがガチで強い。\n\n今期の新作もほぼ全部網羅してる🔥"
      recommendation:
        - "30日間の無料トライアルがあるから\nアニメ好きは試さない理由がない。\n合わなければ無料期間中に解約でOK"
        - "月550円は缶コーヒー4本分。\nそれでアニメ見放題なら最高のコスパだろ🎉"
        - "無料トライアルで今期アニメ一気見するのがおすすめ。\n俺はそれでハマった😂"

  - topic: "Audible"
    template: |
      #PR
      {{ intro }}

      {{ usage }}

      {{ honest_review }}

      気になる人はプロフのリンクをチェック🎧
    variables:
      intro:
        - "「読書する時間がない」って人に\nAudible（オーディオブック）がマジでおすすめ🎧"
        - "通勤時間が「読書時間」に変わった話。\nAudibleを半年使った感想"
      usage:
        - "俺の使い方：\n🚗 通勤中にビジネス書を「聴く」\n🏃 ランニング中に小説を「聴く」\n🍳 料理中にニュースを「聴く」\n\nスキマ時間だけで月3-4冊読めてる📚"
        - "良いところ：\n✅ プロのナレーターで聴きやすい\n✅ 12万冊以上が聴き放題\n✅ オフラインでも再生OK\n✅ 倍速再生で時短可能\n\n忙しい人ほどハマると思う"
      honest_review:
        - "デメリット：\n・ナレーターの声が合わない場合がある\n・図解付きの本は聴くだけだと厳しい\n\nでも30日間の無料体験があるから試してみて"
        - "正直、最初は「聴く読書って微妙じゃない？」って思ってた。\nでも慣れると紙の本より便利。\n\n30日無料だから気軽に試してみて🎧"
