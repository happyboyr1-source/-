# サブスク・VOD エンゲージメント テンプレート
templates:
  - topic: "視聴状況"
    template: |
      {{ question }}

      {{ personal }}

      {{ cta }}
    variables:
      question:
        - "今週末、何観る予定？🎬"
        - "最近ハマってるドラマorアニメある？📺"
        - "一番泣いた映画を教えてくれ😭"
        - "人生で一番面白かったアニメは？🏆"
      personal:
        - "俺は今期アニメの消化が追いつかなくて嬉しい悲鳴🎉\nとりあえず3作品は最後まで追いかける予定"
        - "俺は最近ずっと韓国ドラマにハマってる😂\nまさか自分がハマるとは思わなかった"
        - "俺は「ショーシャンクの空に」を超える映画にまだ出会えてない。\n異論は認める"
        - "俺は鬼滅でも呪術でもなく「STEINS;GATE」推し。\n何回観ても最終回で泣く"
      cta:
        - "おすすめあったらリプで教えてくれ🙏\n今夜の視聴リストに追加する"
        - "語りたい作品があったらリプどうぞ🎬"
        - "みんなの推し作品、めっちゃ気になる👀"

  - topic: "ランキング"
    template: |
      {{ ranking_intro }}

      {{ ranking }}

      {{ discussion }}
    variables:
      ranking_intro:
        - "俺的 今期アニメランキング（暫定）🏆"
        - "最近観た映画ベスト3を発表する🎬"
        - "VODで観れる神アニメランキング更新するぜ📺"
      ranking:
        - "🥇 フリーレン（安定の神作画）\n🥈 推しの子（展開が読めない）\n🥉 薬屋のひとりごと（猫猫かわいい）\n\n今期レベル高すぎないか？🔥"
        - "🥇 オッペンハイマー（衝撃）\n🥈 ゴジラ-1.0（日本映画の底力）\n🥉 君たちはどう生きるか（考察沼）\n\nどれも劇場で観るべきだった..."
        - "🥇 進撃の巨人（完結おめでとう）\n🥈 鬼滅の刃（映像美がヤバい）\n🥉 SPY×FAMILY（家族で見れる最強作品）\n\n異論はリプで受け付ける⚔️"
      discussion:
        - "「このランキングおかしい！」ってツッコミ待ってるぜ😏"
        - "みんなのランキングも教えてくれ👇"
        - "ランキング外で推したい作品があったらリプ頼む🙏"

  - topic: "サブスク全般"
    template: |
      {{ topic_question }}

      {{ options_or_opinion }}

      {{ engage }}
    variables:
      topic_question:
        - "みんなVODいくつ契約してる？💰"
        - "「もうこのサブスクなしでは生きられない」ってやつある？"
        - "正直、月額いくらまでならVODに払える？🤔"
      options_or_opinion:
        - "1️⃣ 1つだけ\n2️⃣ 2つ\n3️⃣ 3つ以上\n4️⃣ 入ってない\n\n俺は常時2つ、気分で3つ目を追加するスタイル"
        - "俺はDMM TVがないと無理。\nアニメ好きにとって月550円は神すぎる。\n\nあとAudibleも地味にハマってる🎧"
        - "1️⃣ 500円まで\n2️⃣ 1000円まで\n3️⃣ 2000円まで\n4️⃣ 金は気にしない\n\n俺は全部合わせて月2000円以内に収めてるぜ💪"
      engage:
        - "コスパ最強のサブスク、みんなのおすすめ教えてくれ🎯"
        - "解約できないサブスクがある人は仲間🤝"
        - "節約派の俺に「これだけは入れ」ってやつ教えてくれ"
