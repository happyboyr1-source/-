# サブスク・VOD Tips テンプレート
templates:
  - topic: "VOD比較"
    template: |
      {{ hook }}

      {{ comparison }}

      {{ verdict }}
    variables:
      hook:
        - "VODサービス、結局どこがいいの問題に決着をつける🎬"
        - "サブスク20個以上試してきた俺の正直ランキング"
        - "「どのVODに入ればいい？」って聞かれるから答えるね📺"
      comparison:
        - "🥇 アニメ好き → DMM TV（月550円で神コスパ）\n🥈 映画好き → U-NEXT（見放題数No.1）\n🥉 海外ドラマ → Netflix（オリジナル最強）\n\n迷ったらU-NEXTの無料トライアルから始めるのがおすすめ🎯"
        - "コスパ重視：DMM TV（月550円）\n作品数重視：U-NEXT（31万本以上）\nオリジナル重視：Netflix\nスポーツも見たい：DAZN\n\n正直、2つ掛け持ちが最強だと思ってる💪"
        - "家族で使うなら：\n🏠 U-NEXT → 4アカウント同時視聴OK\n🏠 Netflix → プランによる\n🏠 DMM TV → 1アカウントのみ\n\nファミリーはU-NEXT一択だな🎬"
      verdict:
        - "結局は「何を観たいか」で決めるのが正解。\n全部無料トライアルあるから試してから決めよう"
        - "俺のおすすめは「U-NEXT + DMM TV」の2刀流⚔️\nこれで大体の作品カバーできるぜ"
        - "悩む時間がもったいないから、\nまず無料トライアルで試してみるのが一番早い🏃"

  - topic: "隠れた名作"
    template: |
      {{ title }}

      {{ recommendations }}

      {{ closing }}
    variables:
      title:
        - "VODに埋もれてるけど実は神作品なアニメ5選🏆"
        - "話題にならないけどガチで面白い映画3選🎬"
        - "子供と一緒に見れて大人も楽しめる作品まとめ👨‍👩‍👧‍👦"
      recommendations:
        - "①ヴァイオレット・エヴァーガーデン（泣ける）\n②メイドインアビス（冒険×感動）\n③ゴールデンカムイ（笑えて熱い）\n④SPY×FAMILY（家族で見れる）\n⑤葬送のフリーレン（じんわり系）\n\n全部U-NEXTかDMM TVで観れるぜ🎯"
        - "①ショーシャンクの空に（何回観ても泣く）\n②グリーンブック（心が温まる）\n③インターステラー（頭がバグる）\n\n週末の映画選びに迷ったらこの中から選べば間違いない✨"
        - "①トイ・ストーリーシリーズ\n②ジブリ作品全般（U-NEXTで見放題）\n③ドラえもん映画\n④ミニオンズ\n\n子供が喜ぶし、親も一緒に楽しめる🎉"
      closing:
        - "他にもおすすめあったらリプで教えてくれ🙏"
        - "「これも面白いぞ」ってのがあったら教えてほしい🎬"
        - "みんなのおすすめも聞きたい！リプ待ってるぜ✨"

  - topic: "新作情報"
    template: |
      {{ news }}

      {{ detail }}

      {{ reaction }}
    variables:
      news:
        - "今期の新作アニメ、注目作をピックアップ🔥"
        - "来月配信開始の注目作品まとめ📺"
        - "今週末に配信される新作映画が豪華すぎる件🎬"
      detail:
        - "個人的に期待してるのはこの3つ：\n🔥 ①原作ファンが待望してたあの作品\n🔥 ②前期覇権アニメの続編\n🔥 ③完全オリジナルのダークホース\n\n全部初日に観る予定💪"
        - "配信プラットフォーム別：\n📺 U-NEXT：話題の映画が早速登場\n📺 DMM TV：独占配信アニメあり\n📺 Netflix：新オリジナルシリーズ\n\nどのサービスも強い作品あるなぁ"
        - "今週末の予定はこれで決まりだな😏\n\n金曜夜：新作映画①\n土曜：アニメ一気見\n日曜：ゆっくりドラマ鑑賞\n\n最高の週末プラン✨"
      reaction:
        - "みんなは今期何観る予定？🤔"
        - "気になる作品あったらリプで語ろうぜ🎬"
        - "一緒にリアタイ実況しようぜ🎉"

  - topic: "コスパ術"
    template: |
      {{ hook }}

      {{ tips }}

      {{ summary }}
    variables:
      hook:
        - "VODの月額を実質タダにする方法を教える💰"
        - "サブスクで損してる人のNG行動3選🙅"
        - "俺が実践してるサブスク節約術がこれ👇"
      tips:
        - "①無料トライアルを全部使う（合計2-3ヶ月タダ）\n②見たい作品がある月だけ契約する\n③家族でシェアできるサービスを選ぶ\n④ポイントバック系を優先する（U-NEXTは毎月1200pt）"
        - "NGなのは：\n❌ 契約したまま放置（月1000円でも年12000円）\n❌ 同じジャンルのサービスを重複契約\n❌ 無料トライアルの解約忘れ\n\n今すぐスマホの課金一覧をチェックしろ🔍"
        - "俺のやり方：\n✅ 常時契約：DMM TV（月550円だけ）\n✅ 見たい作品がある月だけ：U-NEXT加入\n✅ 年1-2ヶ月：Netflix（オリジナル一気見）\n\n年間の出費：約2万円で十分楽しめてる🎉"
      summary:
        - "賢く使えばVODは最高のコスパ娯楽だぜ👍"
        - "月500円で映画もアニメも見放題の時代、最高すぎる🎬"
        - "詳しい比較はプロフのリンクにまとめてるよ📝"
