# 転職・キャリア Tips テンプレート
templates:
  - topic: "年収交渉"
    template: |
      転職の面接で「希望年収は？」と聞かれた時のベストな答え方：

      ❌「{{ bad_answer }}」
      ⭕「{{ good_answer }}」

      {{ advice }}
    variables:
      bad_answer:
        - "御社の規定に従います"
        - "いくらでも構いません"
        - "前職と同じで大丈夫です"
      good_answer:
        - "現在の年収はXX万で、XX万を希望しています"
        - "市場相場を調べた上でXX万〜XX万を希望します"
        - "スキルと経験を踏まえてXX万以上を希望しています"
      advice:
        - "ポイントは先に相手に提示させないこと。僕はこれで50万のUPに成功した"
        - "根拠を持って伝えることが大事。曖昧だと買い叩かれるよ"
        - "転職エージェントに相場を聞いておくと自信を持って言えるよ"

  - topic: "面接対策"
    template: |
      面接で落ちる人の共通点{{ number }}選：

      {{ points }}

      {{ conclusion }}
    variables:
      number:
        - "3"
        - "5"
      points:
        - "①志望動機が「御社の成長性」だけ\n②逆質問を用意していない\n③退職理由がネガティブ"
        - "①話が長い（30秒以上）\n②数字で語れない\n③企業研究が甘い\n④逆質問がゼロ\n⑤身だしなみに無頓着"
      conclusion:
        - "全部僕の実体験。失敗から学んだことを共有するね"
        - "心当たりある人、今からでも全然間に合うから大丈夫"

  - topic: "職務経歴書"
    template: |
      {{ hook }}

      {{ detail }}

      {{ takeaway }}
    variables:
      hook:
        - "職務経歴書、「業務内容をそのまま書く」のはNG"
        - "書類選考が通らない人の職務経歴書には共通点がある"
        - "僕が書類通過率80%になった職務経歴書の書き方"
      detail:
        - "大事なのは「何をしたか」じゃなくて「どんな成果を出したか」\n\n例：\n❌ 営業を担当\n⭕ 新規開拓営業で前年比150%の売上達成"
        - "ポイントは3つ：\n1. 数字で成果を語る\n2. 課題→行動→結果の構成にする\n3. 応募先に合わせてカスタマイズ"
        - "採用担当は平均30秒しか見ない\n\nだから冒頭の「職務要約」で勝負が決まる\n結論→根拠→数字の順で書こう"
      takeaway:
        - "書き方ひとつで通過率は劇的に変わるよ"
        - "テンプレートに頼るんじゃなくて、自分の言葉で書くのが大事"
        - "詳しい書き方はプロフのリンクにまとめてある"

  - topic: "IT転職"
    template: |
      {{ opening }}

      {{ body }}

      {{ closing }}
    variables:
      opening:
        - "未経験からITエンジニアに転職するなら、まずこの3つをやってほしい"
        - "30歳からのIT転職、実は全然遅くない"
        - "営業からエンジニアに転職した僕が言いたいこと"
      body:
        - "1. Progateで基礎を学ぶ（2週間）\n2. 簡単なアプリを1つ作る（1ヶ月）\n3. GitHubにポートフォリオを公開する"
        - "IT業界は「実力主義」だから年齢じゃなくてスキルで評価される\n\n僕は30歳で未経験転職したけど、半年で年収100万UP"
        - "大事なのは「完璧なスキル」じゃなくて「学ぶ意欲」\n\n面接では技術力より「なぜITなのか」が一番聞かれた"
      closing:
        - "行動しないと何も変わらない。まず小さな一歩から"
        - "迷ってる時間がもったいない。今日から始めよう"
        - "質問あったら気軽にリプしてね"

  - topic: "副業・スキルアップ"
    template: |
      {{ hook }}

      {{ content }}

      {{ cta }}
    variables:
      hook:
        - "本業の年収だけに頼るのはリスクだと気づいた話"
        - "副業で月5万稼ぐまでにやったこと"
        - "スキルアップに投資した結果、年収が200万上がった"
      content:
        - "僕は副業でWebライティングを始めた\n\n最初の3ヶ月は月1万円\nでも半年後には月10万超え\n\n大事なのは継続すること"
        - "やったこと：\n・朝30分の読書\n・週末のオンライン学習\n・資格取得（1つでOK）\n\n全部合わせても1日1時間もかかってない"
        - "投資した金額：約20万円（書籍+講座）\nリターン：年収200万UP\n\n自己投資のROI、最強すぎる"
      cta:
        - "みんなは何かスキルアップしてる？"
        - "一歩踏み出すだけで景色が変わるよ"
        - "おすすめの副業についてはプロフのリンクから"

  - topic: "リモートワーク"
    template: |
      {{ statement }}

      {{ explanation }}

      {{ advice }}
    variables:
      statement:
        - "リモートワークで年収が下がると思ってる人、それ誤解だよ"
        - "フルリモートの会社に転職して生活が激変した話"
        - "リモートワーク3年目の僕の正直な感想"
      explanation:
        - "むしろリモート可の企業はIT系に多くて、年収水準が高い\n\n通勤時間ゼロ+年収UPって最高じゃない？"
        - "通勤2時間→0時間\n光熱費UP→でも交通費・外食費が激減\n\n年間で50万円くらい浮いてる計算"
        - "良い点：通勤なし、集中できる、家族との時間増\n課題：運動不足、コミュニケーション、ON/OFF切替"
      advice:
        - "リモートワーク求人は「IT転職サイト」で探すのが効率的"
        - "最初は週2-3リモートから始めるのがおすすめ"
        - "自己管理能力がある人には本当におすすめ"
