# 転職・キャリア スレッド投稿テンプレート
templates:
  - topic: "IT転職体験談"
    parts:
      - template: |
          【{{ title }}】

          {{ intro }}

          やったことを全部書く👇
          ({{ part_num }}/{{ total_parts }})
        variables:
          title:
            - "営業からITエンジニアに転職した話"
            - "文系未経験からWebエンジニアになった話"
            - "30歳で異業種転職して年収100万UPした話"
          intro:
            - "30歳、営業5年目。\n「このまま40歳になるのか...」と不安になって\nプログラミング学習を始めた。\n\n結果、8ヶ月で転職成功。年収は50万UP。"
            - "大学は文学部。IT知識ゼロ。\nでも「このままじゃダメだ」と思って、\n28歳でプログラミング学習を開始。\n\n10ヶ月後、Webエンジニアとして内定をもらった。"
            - "前職：メーカー営業（年収450万）\n現職：IT企業のPM（年収550万）\n\n異業種転職は不安だったけど、\n結果的に最高の決断だった。"

      - template: |
          {{ phase_title }}

          {{ phase_detail }}

          {{ phase_lesson }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          phase_title:
            - "【Phase 1：学習期間（1-3ヶ月目）】"
            - "【ステップ1：基礎学習（最初の3ヶ月）】"
          phase_detail:
            - "・Progateを3周\n・YouTubeで基礎を補強\n・毎日30分〜1時間（朝活）\n\nここで大事なのは「完璧を目指さない」こと。\n60%理解できたら次に進む。"
            - "・HTML/CSS/JavaScriptを順番に学習\n・書籍2冊 + Progate\n・平日1時間 + 休日3時間\n\n最初は全然わからなくて何度も挫折しかけた。"
          phase_lesson:
            - "この時期のコツは「仲間を作ること」。\nTwitterで学習仲間を見つけて励まし合った"
            - "ポイントは「完璧主義を捨てる」こと。\nわからなくても先に進んでOK"

      - template: |
          {{ phase_title }}

          {{ phase_detail }}

          {{ phase_lesson }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          phase_title:
            - "【Phase 2：ポートフォリオ制作（4-6ヶ月目）】"
            - "【ステップ2：実践（4-6ヶ月目）】"
          phase_detail:
            - "・オリジナルWebアプリを1つ制作\n・GitHubにソースコードを公開\n・READMEをしっかり書く\n\n企業はポートフォリオの「質」を見てる。\nデザインよりも「なぜ作ったか」が大事。"
            - "・簡単なToDoアプリから開始\n・徐々に機能を追加\n・最終的にオリジナルサービスを制作\n\nここが一番キツかった。\nでも「動くもの」ができた時の感動は忘れられない。"
          phase_lesson:
            - "ポートフォリオは1つでいいから「なぜ作ったか」を語れるものを作ろう"
            - "完成度70%でもいいから「動くもの」を作ることが大事。\n完璧を目指すと永遠に完成しない"

      - template: |
          {{ phase_title }}

          {{ phase_detail }}

          {{ closing }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          phase_title:
            - "【Phase 3：転職活動（7-8ヶ月目）】"
            - "【ステップ3：転職活動（最後の2ヶ月）】"
          phase_detail:
            - "・転職エージェント2社に登録\n・未経験OKの求人を中心に20社応募\n・書類通過率：50%\n・最終面接通過率：30%\n\n結果、3社から内定。年収は前職+50万。"
            - "・転職サイト+エージェント併用\n・15社に応募 → 8社書類通過 → 3社内定\n・面接ではポートフォリオを画面共有で見せた\n\n「何を作ったか」より「どう考えて作ったか」を聞かれた。"
          closing:
            - "8ヶ月は長く感じたけど、人生を変えるには十分な期間だった。\n\n迷ってる人がいたら、まず今日Progateを開いてみて。\nそれが最初の一歩になるから"
            - "振り返ると大変だったけど、あの時行動して本当によかった。\n\n「もう遅い」なんてことはない。\n今日が一番若い日だよ"

  - topic: "年収アップ術"
    parts:
      - template: |
          【年収を{{ amount }}万上げるためにやった{{ count }}つのこと】

          {{ intro }}

          全部シェアするね👇
          ({{ part_num }}/{{ total_parts }})
        variables:
          amount:
            - "200"
            - "150"
            - "300"
          count:
            - "5"
            - "4"
          intro:
            - "新卒で年収350万だった僕が、5年で550万まで上げた方法。\n特別な才能は一切不要。\n地道にやれば再現性がある方法だよ。"
            - "社会人3年目で「このまま年収が上がらない」と気づいて行動を開始。\n結果、2回の転職で年収が倍近くになった。"

      - template: |
          {{ point_title }}

          {{ point_detail }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          point_title:
            - "①市場価値を正しく知る\n②成長業界を選ぶ\n③スキルを可視化する"
          point_detail:
            - "まず転職サイトに登録してスカウトの年収を確認。\n\n「自分の市場価値」を知るだけで、\n年収交渉のスタートラインが変わる。\n\n成長業界（IT、SaaS等）は年収水準自体が高い。\n業界を変えるだけで100万変わることもある。"

      - template: |
          {{ point_title }}

          {{ point_detail }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          point_title:
            - "④転職エージェントを使い倒す\n⑤年収交渉は必ずする"
          point_detail:
            - "エージェントは無料で使えるプロ。\n年収交渉を代行してもらうだけで\n50万変わった実体験がある。\n\n「提示額をそのまま受け入れる」のは\n一番もったいないこと。\n必ず交渉しよう。"

      - template: |
          {{ summary }}

          {{ message }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          summary:
            - "まとめると、年収UPに必要なのは\n「正しい戦略」と「行動力」だけ。\n\n特別なコネも学歴も不要。"
          message:
            - "僕にできたんだから、きっとみんなにもできる。\n\n参考になったらいいね・RTしてもらえると嬉しいです。\nもっと詳しい話はプロフのリンクから"
