# 転職・キャリア アフィリエイト投稿テンプレート（#PR付き）
templates:
  - topic: "転職エージェント"
    template: |
      #PR
      {{ experience }}

      {{ benefit }}

      {{ caveat }}

      詳しくはプロフのリンクから
    variables:
      experience:
        - "僕が転職活動で一番助かったのが転職エージェントの存在。\n書類添削から面接対策まで全部無料でやってくれた"
        - "正直、最初は転職エージェントって怪しいと思ってた。\nでも使ってみたら全然違った"
        - "転職エージェントを使わずに転職活動してた時、書類通過率20%だった。\nエージェント経由にしたら70%に跳ね上がった"
      benefit:
        - "特に良かったのは「非公開求人」を紹介してもらえたこと。\n自分で探してたら絶対見つからなかった企業に出会えた"
        - "年収交渉を代わりにやってくれるのが神。\n自分では言いにくい金額もプロが交渉してくれる"
        - "面接の日程調整を全部やってくれるから、在職中でも効率的に活動できた"
      caveat:
        - "ただし、エージェントの質は担当者次第。\n合わないと思ったら遠慮なく変えてもらおう"
        - "注意点：複数のエージェントを並行利用するのがベスト。\n1社だけだと比較ができないからね"
        - "全部が全部いいわけじゃない。\nでも無料で使えるから試す価値は絶対にある"

  - topic: "プログラミングスクール"
    template: |
      #PR
      {{ story }}

      {{ recommendation }}

      {{ honest_note }}

      気になる人はプロフのリンクをチェックしてみて
    variables:
      story:
        - "僕がIT転職の時に使ったプログラミングスクール。\n正直、独学で挫折した僕には「強制的にやる環境」が必要だった"
        - "プログラミング独学で3回挫折した僕が、スクールに通って3ヶ月でWebアプリを作れるようになった話"
        - "「プログラミングスクールって高くない？」ってよく聞かれるけど、転職後の年収UPで半年で元が取れた"
      recommendation:
        - "転職保証があるのも安心材料。\n万が一転職できなかったら全額返金"
        - "カリキュラムがしっかりしてるから、未経験でも段階的にスキルが身につく。\nメンターに質問し放題なのも大きかった"
        - "オンラインで完結するから、仕事しながらでも学べる。\n僕は平日の夜と週末で勉強してた"
      honest_note:
        - "もちろん「通えば自動的にスキルがつく」わけじゃない。\n自分の努力は絶対必要"
        - "向き不向きはあると思う。\nでも無料相談で雰囲気は掴めるから、迷ってるならまず相談してみて"
        - "安くはないけど、自己投資として考えたらROIは最強クラス"

  - topic: "転職サイト"
    template: |
      #PR
      {{ intro }}

      {{ comparison }}

      {{ cta }}
    variables:
      intro:
        - "転職サイト、正直どこがいいか迷うよね。\n僕が3サイト使った正直な感想をシェアする"
        - "「とりあえず転職サイトに登録」は正解。\nでもどこに登録するかで全然違う"
      comparison:
        - "・求人数重視 → 大手R社\n・IT特化 → 専門エージェント\n・年収交渉力 → D社\n\n結局、2-3社並行がベスト"
        - "・20代なら → 若手特化型\n・IT系なら → エンジニア専門\n・年収600万以上 → ハイクラス特化\n\n自分の状況に合ったサイトを選ぼう"
      cta:
        - "詳しい比較はプロフのリンクにまとめてるよ"
        - "どれも無料で使えるから、迷ったら複数登録がおすすめ。\n詳細はプロフのリンクから"
