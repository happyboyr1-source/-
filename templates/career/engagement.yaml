# 転職・キャリア エンゲージメント テンプレート
templates:
  - topic: "転職全般"
    template: |
      {{ question }}

      {{ personal }}

      みんなはどうだった？
    variables:
      question:
        - "転職活動で一番しんどかったことは？"
        - "転職を決意したきっかけって何だった？"
        - "面接で一番困った質問は何？"
        - "転職してよかったと思う瞬間っていつ？"
      personal:
        - "僕は「在職中の面接日程調整」が地獄だった...\n有給使い果たして半休の嵐"
        - "僕の場合は「このまま10年後も同じ仕事してるのか」って不安になった瞬間"
        - "僕は「あなたの弱みは？」が苦手だった\n弱みを正直に言うと落ちそうだし..."
        - "僕は初めての給与明細を見た時。前職より手取りが8万増えてた"

  - topic: "キャリア"
    template: |
      {{ poll_question }}

      {{ options }}

      {{ comment }}
    variables:
      poll_question:
        - "転職で一番重視するものは？"
        - "キャリアの悩みで一番多いのはどれ？"
        - "転職するなら何歳までにしたい？"
      options:
        - "1️⃣ 年収\n2️⃣ やりがい\n3️⃣ ワークライフバランス\n4️⃣ 将来性"
        - "1️⃣ 年収が低い\n2️⃣ やりがいがない\n3️⃣ 人間関係\n4️⃣ 将来が不安"
        - "1️⃣ 25歳まで\n2️⃣ 30歳まで\n3️⃣ 35歳まで\n4️⃣ 年齢は関係ない"
      comment:
        - "僕は迷わず④を選ぶ"
        - "ちなみに僕は③だった"
        - "僕は④派。何歳でも挑戦できると思ってる"

  - topic: "モチベーション"
    template: |
      {{ motivational_message }}

      {{ detail }}
    variables:
      motivational_message:
        - "月曜の朝って憂鬱だよね。\n\nでもそれ、「今の仕事が合ってないサイン」かもしれない"
        - "「転職したいけど勇気がない」って人へ。\n\n最初の一歩は転職サイトに登録するだけでいい"
        - "「自分にはスキルがない」って思ってる人。\n\n今の仕事で身につけたスキル、意外と他の業界で評価されるよ"
      detail:
        - "僕も毎週日曜の夜が憂鬱だった。\n今は日曜に翌日の仕事のアイデアを考えるのが楽しい。\n環境を変えただけでこんなに変わるとは思わなかった"
        - "登録しただけでスカウトが来ることもある。\n市場価値を知るだけでも視野が広がるよ"
        - "営業力→ITのPM\n事務スキル→業務改善コンサル\n接客経験→カスタマーサクセス\n\n可能性は思ってるより広い"

  - topic: "週末振り返り"
    template: |
      {{ weekend_question }}

      {{ sharing }}
    variables:
      weekend_question:
        - "今週学んだことを一つシェアしてみない？\n小さなことでもOK"
        - "今週のお仕事お疲れさま。\nキャリアについて考えたこと、何かあった？"
        - "週末は自己投資の時間。\nみんなは何に時間使ってる？"
      sharing:
        - "僕は「プレゼンで数字を先に出すと説得力が増す」と学んだ。\n来週から実践する"
        - "僕は今週、新しい技術の勉強を1時間だけ始めた。\n小さな一歩でも前に進んでる感覚がいい"
        - "僕は読書。今月3冊目。\nインプットなしにアウトプットは出ないからね"
