# オンライン英会話・教育 スレッド投稿テンプレート
templates:
  - topic: "英語学習体験談"
    parts:
      - template: |
          【{{ title }}】

          {{ intro }}

          私がやったことを全部シェアするね👇
          ({{ part_num }}/{{ total_parts }})
        variables:
          title:
            - "TOEIC400→850になるまでにやったこと"
            - "英語が全く話せなかった私が日常会話できるようになった話"
            - "社会人から英語を始めて1年で変わったこと"
          intro:
            - "高校の英語は赤点常連。\n大学では英語の授業を避けまくった。\n\nそんな私が社会人3年目で一念発起。\n2年でTOEIC850を達成した。"
            - "「英語コンプレックス」をずっと抱えてた私。\n海外旅行でまともに注文もできなくて、悔しかった。\n\nそこから本気で英語学習を始めた。"

      - template: |
          {{ phase }}

          {{ detail }}

          {{ lesson }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          phase:
            - "【最初の3ヶ月：基礎固め期】"
          detail:
            - "やったこと：\n📖 中学英文法の復習（1冊だけ）\n📱 単語アプリで毎日50単語\n🎧 英語Podcastを聞き流し\n\n1日の学習時間：約30分"
          lesson:
            - "この時期で大事なのは\n「基礎を馬鹿にしないこと」\n\n中学英語が完璧なら、日常会話の8割はカバーできる✨"

      - template: |
          {{ phase }}

          {{ detail }}

          {{ lesson }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          phase:
            - "【4-8ヶ月目：実践期】"
          detail:
            - "やったこと：\n💬 オンライン英会話（週5回）\n📺 海外ドラマを英語字幕で視聴\n📝 英語日記（毎日3行）\n\nアウトプットを増やしたら一気に伸びた"
          lesson:
            - "ここが転換点だった。\n「知ってる英語」と「使える英語」は全然違う。\n\nオンライン英会話で「使う」練習をしたら、\n英語が口から出てくるようになった✨"

      - template: |
          {{ summary }}

          {{ message }}
          ({{ part_num }}/{{ total_parts }})
        variables:
          summary:
            - "振り返ると、一番大事だったのは\n「毎日少しでも英語に触れる」こと。\n\n10分でもいい。ゼロにしないことが全て。"
          message:
            - "英語は誰でも話せるようになる。\n必要なのは正しい方法と継続だけ。\n\n一緒に頑張ろう💪✨\n\nもっと詳しい学習法はプロフのリンクにまとめてるよ"
