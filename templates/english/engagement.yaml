# オンライン英会話・教育 エンゲージメント テンプレート
templates:
  - topic: "学習状況"
    template: |
      {{ question }}

      {{ personal }}

      {{ cta }}
    variables:
      question:
        - "今日の英語学習、何した？📚"
        - "英語学習で一番苦労してることは？"
        - "今週、英語に何時間触れた？"
        - "英語学習のきっかけって何だった？"
      personal:
        - "私は朝のシャドーイング15分と、夜の単語復習10分✨\n少ないけど毎日やるのが大事だと思ってる"
        - "私はリスニング。何度聞いても聞き取れない単語がある...\nでも半年前よりは確実に聞けるようになった"
        - "私は今週5時間。ちょっと少なかったかな💦\nでもゼロじゃないからOKとする"
        - "私はTOEICのスコアが必要だったから。\nでも今は純粋に楽しくなってる🌍"
      cta:
        - "リプで教えてくれたら嬉しいな✨"
        - "みんなの悩み聞かせて。一緒に解決策考えよう💪"
        - "報告し合うとモチベーション上がるよね"

  - topic: "英語クイズ"
    template: |
      {{ quiz }}

      {{ options }}

      {{ answer_hint }}
    variables:
      quiz:
        - "英語クイズ🇺🇸\n「お疲れ様」って英語でなんて言う？"
        - "この英語、正しいのはどっち？🤔"
        - "ビジネスメールでNGな表現はどれ？📧"
      options:
        - "A) Good work today!\nB) You must be tired.\nC) Thank you for your hard work.\nD) 実は「お疲れ様」に直訳はない！"
        - "A) I look forward to hear from you.\nB) I look forward to hearing from you.\n\nヒント：look forward to の後は...？"
        - "A) ASAP\nB) FYI\nC) BTW\nD) 実は全部カジュアル"
      answer_hint:
        - "正解は明日の投稿で発表するよ！\nわかった人はリプで答えてみて✨"
        - "答えがわかった人は「いいね」してね👍\n正解は夜に発表します"
        - "意外と間違えやすいやつ。\n答えは引用RTで発表するね"

  - topic: "モチベーション"
    template: |
      {{ message }}

      {{ story }}
    variables:
      message:
        - "英語学習、今日もお疲れさま✨\n\n「続けてる自分」を褒めてあげて"
        - "英語が話せるようになったら何したい？\n\n目標をイメージするとモチベ上がるよ"
        - "「才能がないから...」って思ってる人へ"
      story:
        - "私も「こんなんで上達するのかな」って何度も思った。\n\nでも半年前の自分と比べたら、確実に成長してる。\n小さな進歩を見逃さないでね💪"
        - "私は「海外ドラマを字幕なしで見る」が目標。\nまだ全然無理だけど😂\n少しずつ聞き取れる量が増えてて嬉しい"
        - "英語に才能は関係ない。\n必要なのは「正しい方法」と「継続」だけ。\n\n私は偏差値40の高校出身。\nそれでもTOEIC850取れた。\nみんななら絶対できるよ✨"
