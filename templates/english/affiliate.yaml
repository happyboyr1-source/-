# オンライン英会話・教育 アフィリエイト投稿テンプレート
templates:
  - topic: "オンライン英会話"
    template: |
      #PR
      {{ experience }}

      {{ benefit }}

      {{ honest }}

      気になる人はプロフのリンクから✨
    variables:
      experience:
        - "オンライン英会話を始めて6ヶ月。\n最初は緊張で全然話せなかったけど、\n今は25分があっという間に感じる"
        - "私がずっと続けてるオンライン英会話のリアルな感想。\n結論：コスパ最強の英語学習法だと思う"
        - "「英会話教室 vs オンライン英会話」\n両方試した私の正直な比較"
      benefit:
        - "良いところ：\n✅ 朝6時でも夜12時でもレッスンOK\n✅ 月額6,000円台〜（カフェ2回分）\n✅ 自宅からパジャマでOK\n✅ 先生が優しくて楽しい"
        - "一番嬉しかったのは、\n外国人に道を聞かれて普通に答えられた時😭\n\n「英語できるんですね！」って言われて\n泣きそうになった"
        - "教室：月4回で1万5千円\nオンライン：毎日で6千円\n\nコスパが10倍くらい違う。\nしかもマンツーマンだから会話量も多い"
      honest:
        - "デメリットもあるよ。\n回線が不安定な時がある。\nあと、自分でモチベ管理する必要がある。\n\nでも無料体験できるから、まず試してみて"
        - "向き不向きはあると思う。\nでも無料体験が2回あるから、\n合うかどうか試してから決められるよ"
        - "正直、最初の1ヶ月はしんどかった。\nでも3ヶ月目くらいから楽しくなってくる。\nまずは無料体験で雰囲気を確かめてみて"

  - topic: "TOEIC教材"
    template: |
      #PR
      {{ intro }}

      {{ review }}

      {{ recommendation }}

      詳しくはプロフのリンクをチェック📖
    variables:
      intro:
        - "TOEICスコアが伸び悩んでる人に。\n私が使って効果を実感した教材を紹介するね"
        - "TOEIC学習アプリ、色々試した中で\n一番続いたのがこれだった"
      review:
        - "良いところ：\n✅ スキマ時間で学習できる（1回3分〜）\n✅ AIが弱点を分析してくれる\n✅ 動画解説がわかりやすい\n✅ 模試が充実してる"
        - "使ってみた感想：\n✅ ゲーム感覚で続けやすい\n✅ リスニング力が明らかに上がった\n✅ 通勤時間を有効活用できる"
      recommendation:
        - "私はこのアプリで3ヶ月で100点UP。\n7日間の無料体験があるから気軽に試せるよ"
        - "まずは無料体験で自分に合うか確認してみて。\n合わなければ解約すればOKだから"

  - topic: "学習サービス"
    template: |
      #PR
      {{ story }}

      {{ comparison }}

      {{ cta }}
    variables:
      story:
        - "独学で英語を学んでた時の悩み：\n「この勉強法で合ってるのか不安」\n\nそんな時に出会ったのが、このサービス"
        - "英語学習に50万円以上使ってきた私が\n今も続けてるサービスはこれだけ"
      comparison:
        - "他のサービスとの違い：\n・カリキュラムが体系的\n・進捗が可視化される\n・コスパが圧倒的にいい\n\nデメリットは自分で時間を作る必要があること"
        - "月額が安いのに内容が充実してる。\nぶっちゃけ、高い英会話教室より効果あった。\n\nただし「自分で続ける意志」は必要"
      cta:
        - "無料体験があるから、まず試してみて。\n合えばラッキーだし、合わなきゃ辞めればいい✨\n\n詳細はプロフから"
        - "気になる人はプロフのリンクからチェックしてみて。\n無料体験中に合わないと思ったら解約OK"
