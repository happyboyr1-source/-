# オンライン英会話・教育 Tips テンプレート
templates:
  - topic: "英語フレーズ"
    template: |
      {{ hook }}

      {{ phrase_pair }}

      {{ explanation }}
    variables:
      hook:
        - "ネイティブが毎日使うのに、教科書に載ってないフレーズ"
        - "「How are you?」に「I'm fine」って答えてない？"
        - "ビジネスメールで使えるワンランク上の表現"
        - "海外ドラマで頻出なのに意外と知らないフレーズ"
      phrase_pair:
        - "❌ I'm fine, thank you.\n⭕ I'm doing great!\n⭕ Not bad, how about you?\n⭕ Can't complain!"
        - "❌ I think so.\n⭕ I'd say so.\n⭕ That's my take on it.\n⭕ I'm fairly certain."
        - "❌ Please check.\n⭕ Could you take a look?\n⭕ I'd appreciate your feedback.\n⭕ Would you mind reviewing this?"
        - "❌ I don't understand.\n⭕ Could you clarify that?\n⭕ I'm not sure I follow.\n⭕ Could you break that down for me?"
      explanation:
        - "自然な英語は「定型文」じゃなくて「バリエーション」がカギ🔑\n毎日1フレーズ覚えるだけで全然違うよ"
        - "ポイントは「丁寧さのレベル」を使い分けること。\n相手との関係性で表現を変えるのがネイティブ流✨"
        - "実は英語って「ストレートに言わない」表現が多い。\n日本語の敬語に近い感覚で使い分けてみて"

  - topic: "TOEIC対策"
    template: |
      {{ title }}

      {{ tips }}

      {{ result }}
    variables:
      title:
        - "TOEICスコアが3ヶ月で150点上がった勉強法"
        - "TOEIC800点超えに必要なのはたった3つの習慣"
        - "TOEICリスニングが苦手な人に試してほしいこと"
      tips:
        - "やったこと：\n📖 公式問題集を3周（これだけでOK）\n🎧 通勤中にリスニング毎日30分\n📝 間違えた問題だけ復習ノートに\n\n特別な教材は不要だった"
        - "①毎朝15分のシャドーイング\n②通勤中にPodcast（英語ニュース）\n③寝る前10分の単語復習\n\nこれを3ヶ月続けただけ"
        - "リスニングのコツは「全部聞こうとしない」こと\n\nキーワードだけ拾う練習をすると、\nPart3・4のスコアが一気に上がる📈"
      result:
        - "私はこれで600→750点に。次は850目指すよ💪"
        - "継続は力なり。毎日少しでもOK。\n一緒に頑張ろう✨"
        - "大事なのは「毎日やること」。\n5分でもいいから英語に触れる習慣を作ろう"

  - topic: "学習習慣化"
    template: |
      {{ opening }}

      {{ method }}

      {{ encouragement }}
    variables:
      opening:
        - "英語学習が続かない人の特徴、全部私に当てはまってた😂"
        - "「3日坊主」だった私が、毎日英語を勉強できるようになった方法"
        - "英語学習のモチベーションが下がった時にやること"
      method:
        - "続かない原因は「目標が高すぎる」こと\n\n最初は1日5分でOK。\nアプリで1問解くだけでもいい。\n\nハードルを下げたら自然と習慣になった"
        - "私がやった3つの工夫：\n✅ 勉強時間を「朝の準備中」に固定\n✅ アプリの通知をONにする\n✅ SNSで学習記録を投稿（監視効果）"
        - "モチベーション下がった時こそ「完了」にこだわらない\n\n教科書を開くだけでOK\nアプリ起動するだけでOK\n\n「ゼロ」にしないことが大事"
      encouragement:
        - "完璧じゃなくていい。続けることが一番の才能✨"
        - "私も何度も挫折してる。でも再開するたびに前より楽になった"
        - "一緒に頑張ってる仲間がいるって心強いよね。\nみんなの学習報告、いつも励みになってます💪"

  - topic: "英会話上達法"
    template: |
      {{ insight }}

      {{ practice }}

      {{ tip }}
    variables:
      insight:
        - "英会話が上達しない人の共通点：\n「インプットばかりでアウトプットしてない」"
        - "オンライン英会話を100回受けて気づいたこと"
        - "英語を「話せる」ようになるまでに実際にかかった時間"
      practice:
        - "おすすめの練習法：\n🗣️ ひとり英語実況（料理中、通勤中）\n📝 日記を英語で書く（3行でOK）\n💬 オンライン英会話（週3回）\n\nこの3つで確実に上達する"
        - "最初の30回：全然話せなくて落ち込む\n30-60回：少しずつ慣れてくる\n60-100回：「あ、英語で考えてる」瞬間が来る\n\nこの「あ」の瞬間が来るまで続けてほしい✨"
        - "答え：約300時間\n\n毎日30分で約2年。\n毎日1時間なら約1年。\n\n長く感じる？でも2年後の自分、英語話せてるよ"
      tip:
        - "まずは「使える表現を10個」覚えて、それを使い回すのがコツ"
        - "完璧な文法より「伝わる英語」を目指そう。\n間違えても大丈夫、伝わればOK"
        - "一番大事なのは「恥ずかしがらないこと」。\nネイティブも文法間違えまくってるから安心して"
